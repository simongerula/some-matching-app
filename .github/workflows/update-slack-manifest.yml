name: Update Slack app manifest

# Pushes manifest.yml to Slack whenever it changes on main.
# One-time setup (Slack CLI service token + SLACK_APP_ID secret) is
# documented in README -> "Automating manifest updates from CI".

on:
  push:
    branches: [main]
    paths:
      - manifest.yml
      - scripts/push-manifest.js
      - .github/workflows/update-slack-manifest.yml
  workflow_dispatch:

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Slack CLI
        run: |
          curl -fsSL https://downloads.slack-edge.com/slack-cli/install.sh | bash
          ls -la "$HOME/.slack/bin/" 2>/dev/null || true
          echo "$HOME/.slack/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Show CLI + repo state
        run: |
          git --version
          slack version || true

      - name: Install npm deps (js-yaml for the manifest conversion)
        run: npm ci

      - name: Push manifest to Slack
        run: node scripts/push-manifest.js
        env:
          SLACK_APP_ID: ${{ secrets.SLACK_APP_ID }}
          SLACK_SERVICE_TOKEN: ${{ secrets.SLACK_SERVICE_TOKEN }}
